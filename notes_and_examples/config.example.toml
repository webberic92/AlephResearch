# Network Configuration
[network]
listen_address = "/ip4/0.0.0.0/tcp/30333"  # Listening on all interfaces on port 30333
bootnodes = ["/ip4/10.0.168.27/tcp/30333"]  # List of initial bootnode addresses for discovery

# Consensus Configuration
[consensus]
batch_size = 256                    # Number of transactions per batch
timeout = 5000                       # Timeout for consensus in milliseconds
fault_tolerance = 1                  # Number of Byzantine faults tolerated

# Logging Configuration
[logging]
level = "info"                       # Logging level: options are "error", "warn", "info", "debug", or "trace"
log_file_path = "/home/aleph-node/logs/consensus.log"  # File path for consensus logs

# Metrics Configuration
[metrics]
enabled = true                       # Enable metrics collection
resource_usage_log = "/home/aleph-node/logs/resource_usage.log"  # Log for CPU and memory usage
transaction_metrics_log = "/home/aleph-node/logs/transaction_metrics.log"  # Log file for transaction metrics

# Node Configuration
[node]
id = 1                               # Unique identifier for the node
total_nodes = 4                      # Total number of nodes in the network
