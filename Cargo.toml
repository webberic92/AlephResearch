[package]
name = "AlephResearch-Original"
version = "0.1.0"
authors = ["Eric Webb <webberic92@yahoo.com>"]
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ring = "0.17.8"
toml = "0.8.19"
reed-solomon-erasure = "6.0.0"
reqwest = { version = "0.12.9", features = ["json"] }
openssl = { version = "0.10", features = ["vendored"] }
axum = { version = "0.7.9", features = ["http1", "http2"] }

[[bin]]
name = "alephRBC"
path = "src/alephRBC.rs"

[[bin]]
name = "alephStart"
path = "src/alephStart.rs"

[[bin]]
name = "generate_keys"
path = "src/generate_keys.rs"