[package]
name = "AlephResearch-Original"
version = "0.1.0"
authors = ["Eric Webb <webberic92@yahoo.com>"]
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
postgres = "0.19"  # For PostgreSQL database interaction
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"  # JSON handling
aws-sdk-cloudwatchlogs = "1.53.0"  # Latest stable version
ring = "0.17.8"  # Add ring for cryptographic functions
toml = "0.8.19"
reed-solomon-erasure = "6.0.0"  # Adjust the version if necessary

[[bin]]
name = "generate_keys"
path = "src/generate_keys.rs"

[[bin]]
name = "alephRBC"
path = "src/alephRBC.rs"